<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWell | Modern E-commerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">Shop<span class="highlight">Well</span>.</a>
            
            <div class="nav-links">
                <button class="cart-btn" id="cart-toggle">
                    <i class="ph ph-shopping-cart"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container hero-content">
            <h1>Discover Style & Quality</h1>
            <p>Curated collection of premium products just for you.</p>
            <a href="#products" class="cta-btn">Shop Now</a>
        </div>
    </header>

    <main class="container" id="products">
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="electronics">Electronics</button>
            <button class="filter-btn" data-category="jewelery">Jewelery</button>
            <button class="filter-btn" data-category="men's clothing">Men's</button>
            <button class="filter-btn" data-category="women's clothing">Women's</button>
        </div>

        <div class="product-grid" id="product-grid">
            <div class="loading-spinner">
                <i class="ph ph-spinner ph-spin"></i>
            </div>
        </div>
    </main>

    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" id="close-cart">
                <i class="ph ph-x"></i>
            </button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <div class="empty-cart">Your cart is empty</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn">Checkout</button>
        </div>
    </aside>

    <div id="toast" class="toast">Item added to cart!</div>

    <script src="cart.js"></script>
    <script src="app.js"></script>
</body>
</html>
